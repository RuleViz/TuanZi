[package]
name = "node-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tool-protocol = { path = "../tool-protocol" }
tool-fs = { path = "../tool-fs" }
tool-patch = { path = "../tool-patch" }
tool-state = { path = "../tool-state" }
tool-exec = { path = "../tool-exec" }
tool-mcp = { path = "../tool-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
napi = { version = "2", features = ["tokio_rt", "serde-json", "napi9"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
