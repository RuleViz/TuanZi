[workspace]
members = [
  "crates/tool-protocol",
  "crates/tool-fs",
  "crates/tool-patch",
  "crates/tool-state",
  "crates/tool-exec",
  "crates/tool-mcp",
  "crates/node-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
glob-match = "0.2"
thiserror = "2"
